
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartCart - Shopping Cart</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <header>
        <nav>
            <h1>🛒 SmartCart</h1>

            <div>
                <button id="cartBtn">
                    Cart (<span id="cartCount">0</span>)
                </button>
            </div>
        </nav>
    </header>


    <!-- Main Content -->
    <main>

        <!-- Hero Section -->
        <section class="hero">
            <h2>Shop Smart, Shop Easy</h2>
            <p>Find your favorite products at the best prices.</p>
        </section>


        <!-- Search Section -->
        <section class="search-section">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search products..."
            >

        </section>


        <!-- Category Filter -->
        <section class="filters">

            <button class="filter-btn active" data-category="all">
                All
            </button>

            <button class="filter-btn" data-category="electronics">
                Electronics
            </button>

            <button class="filter-btn" data-category="clothing">
                Clothing
            </button>

            <button class="filter-btn" data-category="shoes">
                Shoes
            </button>

        </section>


        <!-- Products -->
        <section class="products-section">

            <h2>Our Products</h2>

            <div id="productContainer">
                <!-- Products JavaScript se yahan aayenge -->
            </div>

        </section>

    </main>


    <!-- Cart Sidebar -->
    <aside id="cartSidebar">

        <div class="cart-header">
            <h2>🛒 Your Cart</h2>

            <button id="closeCart">✕</button>
        </div>


        <div id="cartItems">
            <!-- Cart items JavaScript se yahan aayenge -->
        </div>


        <div class="cart-footer">

            <p>
                Subtotal:
                ₹<span id="subtotal">0</span>
            </p>

            <p>
                Discount:
                ₹<span id="discount">0</span>
            </p>

            <h3>
                Total:
                ₹<span id="total">0</span>
            </h3>

            <button id="checkoutBtn">
                Checkout
            </button>

        </div>

    </aside>


    <!-- Checkout Modal -->
    <div id="checkoutModal">

        <div class="modal-content">

            <button id="closeModal">✕</button>

            <h2>Checkout</h2>

            <form id="checkoutForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="text"
                    id="address"
                    placeholder="Delivery Address"
                    required
                >

                <button type="submit">
                    Place Order
                </button>

            </form>

        </div>

    </div>


    <!-- Notification -->
    <div id="notification"></div>


    <script src="script.js"></script>

</body>

</html>
